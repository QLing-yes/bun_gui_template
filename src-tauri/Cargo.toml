[package]
name = "aigc"
version = "0.1.0"
description = "A Tauri App"
edition = "2024"

# rlib 供桌面二进制复用；移动端必须产出 staticlib（iOS）/ cdylib（Android）
[lib]
name = "aigc_lib"
crate-type = ["rlib", "staticlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rand = "0.9"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-single-instance = "2.5.5"

# 本地 bun 服务仅桌面端存在（移动端无本地服务、不打包 bun），相关依赖不参与移动端编译
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 退出通知本地 bun 服务（仅本机 http，无 TLS 需求）
ureq = { version = "2", default-features = false }
# 读取服务目录 .env 的 PORT，与 bun 运行时共用同一份配置
dotenvy = "0.15"
# 终端日志文件名按本地日期分天
chrono = "0.4"
# 设备码：Windows 取 SMBIOS UUID、macOS 取 IOPlatformUUID、Linux 取 machine-id（重启/重装不变）
machine-uid = "0.6"
# TAURI_SIDECAR 凭证 JSON 序列化：设备码可能含特殊字符，不手拼字符串
serde_json = "1"

# devtools 只能按 cargo feature 开关（cfg(debug_assertions) 不能用于选择依赖，cargo 会告警并失效）
# dev 由 scripts/dev.ts 传 `--features devtools`，release 不带 → 包体不含 DevTools
[features]
devtools = ["tauri/devtools"]

# WebView2 非客户区支持（触摸拖窗）+ DWM 边框控制；windows 用 core::Interface 做接口 cast
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
webview2-com = "0.39"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
