[package]
name = "aigc"
version = "0.1.0"
description = "A Tauri App"
edition = "2024"

# 桌面应用仅需 rlib；staticlib/cdylib 供移动端使用
[lib]
name = "aigc_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["fs"] }
tauri-plugin-window-state = "2.5.0"
tauri-plugin-single-instance = "2.5.5"
serde = { version = "1", features = ["derive"] }

# devtools 只能按 cargo feature 开关（cfg(debug_assertions) 不能用于选择依赖，cargo 会告警并失效）
# dev 由 scripts/dev.ts 传 `--features devtools`，release 不带 → 包体不含 DevTools
[features]
devtools = ["tauri/devtools"]

# WebView2 非客户区支持（触摸拖窗）+ DWM 边框控制；windows 用 core::Interface 做接口 cast
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
webview2-com = "0.39"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
